name: Daily menu fetch
 
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 6:17 am Eastern (EDT), before breakfast
  workflow_dispatch:         # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_menu.py
      - name: Commit today's menu
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menus/
          git diff --cached --quiet || git commit -m "Menu for $(date +%F)"
          git push
